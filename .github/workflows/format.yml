name: Format Python Code
on: [push, pull_request]

jobs:
  format-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Explicitly forces write permissions
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Clean and Commit with Black
        run: |
          pip install black==23.11.0
          
          # Target only your specific folder
          black sysdata/parquet/
          
          # Native Git configuration to push directly
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          # Add changes and check if there is anything to commit
          git add sysdata/parquet/
          if ! git diff-index --quiet HEAD; then
            git commit -m "style: auto-format python code with black"
            git push
          else
            echo "No formatting changes needed!"
          fi
